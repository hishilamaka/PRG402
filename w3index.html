<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfnoBhag</title>
    <link rel="stylesheet" href="w3style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="container">
    <h1 class="logo">AfnoBhag</h1>

    <div id="people-section">
        <h2>Add People</h2>
        <input type="text" id="person-name" placeholder="Name">
        <input type="number" id="person-paid" placeholder="Amount Paid">
        <button id="add-person">Add</button>
    </div>

    <h3>People List</h3>
    <ul id="people-list"></ul>

    <button id="calculate-btn">Calculate Split</button>

    <h3>Result</h3>
    <div id="result"></div>
</div>

<script src="w3App.js"></script>
</body>
</html>
