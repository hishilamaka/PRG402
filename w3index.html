<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AfnoBhag</title>
  <link rel="stylesheet" href="w3style.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="logo">AfnoBhag</div>

    <!-- Hamburger icon -->
    <div class="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <ul class="nav-links">
      <!-- Close button for sidebar -->
      <li class="close-btn" onclick="toggleMenu()">×</li>
      <li><a href="#home" onclick="toggleMenu()">Home</a></li>
      <li><a href="#add" onclick="toggleMenu()">Add Expense</a></li>
      <li><a href="#result" onclick="toggleMenu()">Results</a></li>
      <li><a href="#about" onclick="toggleMenu()">About</a></li>
    </ul>
  </nav>

  <div id="overlay" onclick="toggleMenu()"></div>

  <section id="home" class="page-section">
    <h2>Welcome 💗</h2>
    <p>Split your group expenses easily — no math needed!</p>
  </section>

  <section id="add" class="page-section">
    <h2>Add Expense</h2>
    <input type="text" id="name" placeholder="Name" />
    <input type="number" id="amount" placeholder="Amount Paid (Rs)" />
    <button id="addBtn">Add</button>
    <ul id="peopleList"></ul>
    <button id="calculateBtn">Calculate Split</button>
  </section>

  <section id="result" class="page-section">
    <h2>Results</h2>
    <div id="resultsBox"></div>
  </section>

  <section id="about" class="page-section">
    <h2>About</h2>
    <p><b>kasko bhag ma kati paryo ta?</b> </p>
  </section>

  <canvas id="confetti"></canvas>
  <script src="w3App.js"></script>

</body>
</html>
